{% extends 'base.html' %}

{% block content %}
<section class="mx-auto max-w-md px-4 sm:px-6 lg:px-8 py-12">
  <h1 class="font-display text-3xl font-bold">Sign in</h1>
  <p class="mt-2 text-slate-600">Use your account to continue.</p>

  <form method="post" action="{% url 'login' %}" class="mt-6 space-y-4 rounded-2xl bg-white/70 backdrop-blur border border-slate-200 p-6 shadow-soft">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="text-red-600 text-sm">{{ form.non_field_errors }}</div>
    {% endif %}
    <div>
      <label for="id_username" class="block text-sm font-medium">Username</label>
      <input type="text" name="username" autofocus required id="id_username" class="mt-1 w-full rounded-xl border-slate-300" />
    </div>
    <div>
      <label for="id_password" class="block text-sm font-medium">Password</label>
      <input type="password" name="password" required id="id_password" class="mt-1 w-full rounded-xl border-slate-300" />
    </div>
    {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <button type="submit" class="w-full px-4 py-2 rounded-xl bg-brand text-white">Login</button>
  </form>

  <p class="mt-4 text-base font-semibold text-slate-900">Don't have an account? <a class="text-brand underline hover:text-brand-dark" href="{% url 'signup' %}{% if next %}?next={{ next }}{% endif %}">Create one</a>.</p>
</section>
{% endblock %}
