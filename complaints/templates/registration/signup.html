{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="mx-auto max-w-md px-4 sm:px-6 lg:px-8 py-12">
  <h1 class="font-display text-3xl font-bold">Create account</h1>
  <p class="mt-2 text-slate-600">Sign up to submit and track complaints.</p>

  <form id="signupForm" class="mt-6 space-y-4 rounded-2xl bg-white/70 backdrop-blur border border-slate-200 p-6 shadow-soft">
  {% csrf_token %}
    <div>
      <label class="block text-sm font-medium">Username</label>
      <input id="su_username" type="text" class="mt-1 w-full rounded-xl border-slate-300" required />
    </div>
    <div>
      <label class="block text-sm font-medium">Email</label>
      <input id="su_email" type="email" class="mt-1 w-full rounded-xl border-slate-300" required />
    </div>
    <div>
      <label class="block text-sm font-medium">Password</label>
      <input id="su_password" type="password" class="mt-1 w-full rounded-xl border-slate-300" minlength="8" required />
    </div>
    <div class="text-sm text-slate-500" id="su_status"></div>
    <button type="submit" class="w-full px-4 py-2 rounded-xl bg-brand text-white">Sign up</button>
  </form>
</section>

<script>
const nextParam = new URLSearchParams(window.location.search).get('next') || '/';
const statusEl = document.getElementById('su_status');

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  statusEl.textContent = 'Creating account...';
  try{
    const payload = {
      username: document.getElementById('su_username').value.trim(),
      email: document.getElementById('su_email').value.trim(),
      password: document.getElementById('su_password').value,
    };
    const res = await fetch('/api/register/', { 
      method: 'POST', 
      headers: { 
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value 
      }, 
      body: JSON.stringify(payload) 
    });
    if(!res.ok){ const t = await res.text(); throw new Error(t || 'Signup failed'); }
    statusEl.textContent = 'Account created. Please check email and then log in.';
    setTimeout(()=>{ window.location.href = '/auth/login/?next=' + encodeURIComponent(nextParam); }, 1000);
  }catch(err){ statusEl.textContent = 'Error: ' + (err.message || 'Signup failed'); }
});
</script>
{% endblock %}
